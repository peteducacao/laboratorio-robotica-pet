<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 225" role="img" aria-labelledby="title desc">
<title id="title">Interruptor gangorra iluminado de três terminais</title><desc id="desc">Corpo preto, tecla basculante e três contatos dourados na parte inferior: entrada de alimentação, saída para carga e negativo do LED indicador.</desc>
<defs><linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66747a"/><stop offset=".35" stop-color="#1c262e"/><stop offset="1" stop-color="#0e151c"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4a2"/><stop offset=".6" stop-color="#ca9d48"/><stop offset="1" stop-color="#906328"/></linearGradient><filter id="sh"><feDropShadow dy="4" stdDeviation="3" flood-opacity=".28"/></filter></defs>
<rect x="41" y="16" width="198" height="169" rx="23" fill="url(#case)" stroke="#141c21" stroke-width="5" filter="url(#sh)"/>
<rect x="56" y="30" width="168" height="138" rx="16" fill="#0d151b" stroke="#64717c" stroke-width="3"/>
<rect x="66" y="37" width="148" height="126" rx="12" fill="#121b21" stroke="#4e5c67" stroke-width="2"/>
<!-- 3 bottom metal contacts integrated into housing -->
<g><rect x="56" y="172" width="28" height="46" rx="4" fill="url(#gold)" stroke="#8e6e37" stroke-width="3"/><rect x="61" y="190" width="18" height="14" rx="2" fill="#f5d27d"/></g><g><rect x="126" y="172" width="28" height="46" rx="4" fill="url(#gold)" stroke="#8e6e37" stroke-width="3"/><rect x="131" y="190" width="18" height="14" rx="2" fill="#f5d27d"/></g><g><rect x="196" y="172" width="28" height="46" rx="4" fill="#353c41" stroke="#17232a" stroke-width="3"/><rect x="201" y="190" width="18" height="14" rx="2" fill="#151b21"/></g>
<text x="70" y="166" font-family="Arial" font-size="12" fill="#f7efdb" font-weight="bold" text-anchor="middle">IN</text>
<text x="140" y="166" font-family="Arial" font-size="12" fill="#f7efdb" font-weight="bold" text-anchor="middle">OUT</text>
<text x="210" y="166" font-family="Arial" font-size="12" fill="#f7efdb" font-weight="bold" text-anchor="middle">LED−</text>
