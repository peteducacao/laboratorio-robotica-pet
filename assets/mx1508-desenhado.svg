<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-labelledby="t d"><title id="t">Ponte H MX1508, vista de cima</title><desc id="d">Módulo vermelho MX1508 com bornes verdes na borda superior, terminais de alimentação e controle na inferior e chip central.</desc><defs>
