 <linearGradient id="cap" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#555b62"/><stop offset=".32" stop-color="#151b20"/><stop offset=".79" stop-color="#2f3439"/><stop offset="1" stop-color="#0d1319"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".23"/></filter>
