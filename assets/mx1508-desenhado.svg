<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-labelledby="title desc">
<title id="title">Ponte H MX1508 — placa vermelha com dois pares de saída para motores</title>
<desc id="desc">Representação da placa de referência: MOTOR B nos dois terminais superiores à esquerda, MOTOR A nos dois terminais à direita; positivo, negativo, IN1, IN2, IN3 e IN4 na base. Duas unidades de capacitores e circuito integrado central.</desc>
