<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
<title id="title">Motor DC com escovas</title><desc id="desc">Motor elétrico cilíndrico prateado visto em perspectiva, dois terminais traseiros e eixo dianteiro.</desc>
<defs>
<linearGradient id="case" x1=".12" y1="0" x2=".83" y2="1"><stop stop-color="#f9fbff"/><stop offset=".19" stop-color="#bfcdd8"/><stop offset=".5" stop-color="#879aa9"/><stop offset=".8" stop-color="#d5e0e9"/><stop offset="1" stop-color="#718896"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf1f7"/><stop offset=".4" stop-color="#aabac7"/><stop offset="1" stop-color="#637989"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ffef7a"/><stop offset=".4" stop-color="#ffcf15"/><stop offset="1" stop-color="#df9300"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f5f7"/><stop offset=".24" stop-color="#acbcc8"/><stop offset=".65" stop-color="#536c7d"/><stop offset="1" stop-color="#d5e0e7"/></linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe9a0"/><stop offset=".55" stop-color="#c69a30"/><stop offset="1" stop-color="#7f621f"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M55 191 Q155 227 282 209 Q336 187 332 166" fill="none" stroke="#486274" opacity=".22" stroke-width="11" filter="url(#shadow)"/>
