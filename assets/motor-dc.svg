<path d="M92 51 Q105 48 116 50 L113 190 Q95 180 87 164 Q70 110 92 51Z" fill="#ffe143" opacity=".8"/>
<path d="M79 75 L114 84 M79 161 L112 170" stroke="#fff18e" stroke-width="4" opacity=".8"/>
<path d="M116 50 Q154 29 234 46 Q283 57 299 90 L302 167 Q285 197 231 205 L120 186 Q103 165 106 121 Q108 79 116 50Z" fill="url(#case)" stroke="#617987" stroke-width="2.8"/>
<path d="M116 55 Q181 37 259 69" stroke="#fcffff" stroke-width="5" opacity=".62" fill="none"/>
<path d="M124 184 Q190 203 257 192" stroke="#536c7a" stroke-width="3" opacity=".46" fill="none"/>
<!-- Stamped seam -->
<path d="M238 49 Q263 60 277 82 L286 182 Q273 198 251 204" fill="none" stroke="#6a8090" stroke-width="3" opacity=".7"/>
<ellipse cx="268" cy="130" rx="60" ry="75" transform="rotate(-14 268 130)" fill="url(#face)" stroke="#788b9a" stroke-width="3"/>
<ellipse cx="267" cy="130" rx="52" ry="67" transform="rotate(-14 267 130)" fill="none" stroke="#f3f8f8" stroke-width="2" opacity=".7"/>
