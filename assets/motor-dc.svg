<ellipse cx="271" cy="138" rx="27" ry="29" fill="#536a77" stroke="#dbe4e8" stroke-width="3"/>
<ellipse cx="271" cy="138" rx="18" ry="20" fill="#ca9f45" stroke="#735c2a" stroke-width="2"/>
<path d="M270 128 L344 165 L348 181 L270 145Z" fill="url(#steel)" stroke="#526978" stroke-width="2"/>
