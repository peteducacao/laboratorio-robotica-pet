<path d="M69 64 L33 60 Q20 58 17 68 L18 81 Q22 88 32 87 L72 91 Z" fill="url(#brass)"/>
<path d="M65 146 L29 146 Q16 144 15 156 L16 169 Q18 176 32 175 L72 171 Z" fill="url(#brass)"/>
<rect x="25" y="67" width="15" height="10" rx="4" fill="#8d753d"/>
<rect x="24" y="153" width="15" height="10" rx="4" fill="#8d753d"/>
</g>
<path d="M51 58 L84 68 L82 97 L59 87 Z" fill="#d94c32"/>
<path d="M49 142 L83 147 L82 177 L56 171 Z" fill="#202d34"/>
