<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 312" role="img" aria-label="Robô TinkerPET sorrindo e piscando um olho">
    <defs>
<style>.eye-blink,.eye-alternative,.robot-happy-smile,.robot-blush{opacity:0}</style>
     <linearGradient id="robot-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fdff"/><stop offset=".50" stop-color="#d8e5f1"/><stop offset="1" stop-color="#8eb3d7"/></linearGradient>
     <linearGradient id="robot-casing" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d2854"/><stop offset=".55" stop-color="#0a1637"/><stop offset="1" stop-color="#071d46"/></linearGradient>
     <linearGradient id="robot-glass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".52" stop-color="#f3f8ff"/><stop offset="1" stop-color="#c8e0f5"/></linearGradient>
     <linearGradient id="robot-ear" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff874"/><stop offset=".50" stop-color="#ffbd18"/><stop offset="1" stop-color="#ff8900"/></linearGradient>
     <radialGradient id="antenna-light"><stop stop-color="#fff8b4"/><stop offset=".49" stop-color="#ffd834"/><stop offset=".8" stop-color="#ff9b0a"/><stop offset="1" stop-color="#ff7400"/></radialGradient>
     <filter id="robot-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
     <filter id="robot-shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#04112a" flood-opacity=".72"/></filter>
    </defs>
    <g class="robot-rays" stroke-width="10" stroke-linecap="round">
     <path d="m76 58-14-23m-7 52-28-12" stroke="#ffce21"/>
     <path d="m245 57 16-25m9 52 27-13" stroke="#08e9fb"/>
    </g>
    <g class="robot-antenna">
     <rect x="150" y="38" width="20" height="54" rx="8" fill="#edf9ff" stroke="#09204a" stroke-width="7"/>
     <circle cx="160" cy="31" r="29" fill="#08234c" stroke="#f3f8ff" stroke-width="6"/>
     <circle cx="160" cy="31" r="18" fill="url(#antenna-light)" stroke="#ffc963" stroke-width="3"/>
     <circle cx="155" cy="25" r="6" fill="#ffffffb0"/>
    </g>
    <g filter="url(#robot-shadow)">
     <rect x="16" y="125" width="58" height="103" rx="28" fill="#071a3b" stroke="#13bcfd" stroke-width="4"/>
     <rect x="24" y="135" width="47" height="81" rx="22" fill="url(#robot-ear)" stroke="#f9c334" stroke-width="3"/>
     <rect x="247" y="125" width="58" height="103" rx="28" fill="#071a3b" stroke="#14bbed" stroke-width="4"/>
     <rect x="250" y="135" width="45" height="81" rx="22" fill="url(#robot-ear)" stroke="#f9c334" stroke-width="3"/>
     <rect x="47" y="85" width="226" height="183" rx="62" fill="url(#robot-casing)" stroke="#05d5fd" stroke-width="5"/>
     <rect x="57" y="93" width="207" height="167" rx="54" fill="url(#robot-shell)" stroke="#fbffff" stroke-width="8"/>
     <rect x="81" y="121" width="161" height="111" rx="29" fill="#0a2d59" stroke="#3d71a3" stroke-width="4"/>
     <rect x="90" y="140" width="143" height="85" rx="22" fill="url(#robot-glass)" stroke="#c6e8f7" stroke-width="3"/>
     <ellipse cx="129" cy="179" rx="15" ry="18" fill="#08254c"/>
     <circle cx="123" cy="171" r="5" fill="#fff"/>
     <circle cx="135" cy="181" r="2" fill="#84d7ff"/>
     <path d="M95 158q50-19 133-4" fill="none" stroke="#ffffff" stroke-opacity=".44" stroke-width="3" stroke-linecap="round"/>
     <circle cx="125" cy="170" r="2.3" fill="#b5eaff"/>
     <g class="eye-blink"><path d="M112 182q16-14 31 0" fill="none" stroke="#08254c" stroke-width="8" stroke-linecap="round"/></g>
     <g class="eye-open"><path d="M186 175q12-17 27-3" fill="none" stroke="#08254c" stroke-width="10" stroke-linecap="round"/><path d="m190 178q10-3 19 5" fill="none" stroke="#08254c" stroke-width="7" stroke-linecap="round"/></g>
     <circle class="eye-alternative" cx="199" cy="177" r="14" fill="#09264c"/>
     <path class="robot-smile" d="M147 203q15 20 33-1" fill="none" stroke="#092b51" stroke-width="8" stroke-linecap="round"/>
     <path class="robot-happy-smile" d="M141 199q20 30 43-1" fill="none" stroke="#092b51" stroke-width="8" stroke-linecap="round"/>
     <g class="robot-blush"><ellipse cx="109" cy="208" rx="12" ry="6" fill="#ff9b95" opacity=".66"/><ellipse cx="216" cy="208" rx="12" ry="6" fill="#ff9b95" opacity=".66"/></g>
     <path d="M104 112h112" stroke="#ffffff82" stroke-width="4" stroke-linecap="round"/>
    </g>
   </svg>