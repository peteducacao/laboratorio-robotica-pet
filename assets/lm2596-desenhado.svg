<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" role="img" aria-labelledby="title desc">
<title id="title">Regulador LM2596</title><desc id="desc">Placa azul com quatro bornes em duas laterais. Vermelho indica positivo, preto indica negativo. Componentes eletrônicos sem legendas repetidas.</desc>
<defs><linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#268edd"/><stop offset=".55" stop-color="#1171b7"/><stop offset="1" stop-color="#07568c"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f5f5"/><stop offset=".45" stop-color="#a2aeb9"/><stop offset="1" stop-color="#687c8a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".25"/></filter></defs>
<rect x="19" y="13" width="322" height="199" rx="9" fill="url(#board)" stroke="#084878" stroke-width="4" filter="url(#shadow)"/>
<circle cx="42" cy="32" r="10" fill="#dba75e" stroke="#f3d38d" stroke-width="3"/><circle cx="42" cy="32" r="5" fill="#304954"/>
<circle cx="320" cy="192" r="10" fill="#dba75e" stroke="#f3d38d" stroke-width="3"/><circle cx="320" cy="192" r="5" fill="#304954"/>
<!-- Four actual terminal openings: IN+/IN- left, OUT+/OUT- right -->
<g id="inplus"><rect x="29" y="51" width="48" height="56" rx="6" fill="#125d9c" stroke="#073d71" stroke-width="3"/><rect x="36" y="60" width="34" height="38" rx="4" fill="#d83535" stroke="#dce5e8" stroke-width="2"/><circle cx="53" cy="79" r="12" fill="url(#s)" stroke="#324859" stroke-width="3"/><path d="M46 75l14 8" stroke="#4b5961" stroke-width="2.5"/></g><g id="inminus"><rect x="29" y="114" width="48" height="56" rx="6" fill="#125d9c" stroke="#073d71" stroke-width="3"/><rect x="36" y="123" width="34" height="38" rx="4" fill="#20272e" stroke="#dce5e8" stroke-width="2"/><circle cx="53" cy="142" r="12" fill="url(#s)" stroke="#324859" stroke-width="3"/><path d="M46 138l14 8" stroke="#4b5961" stroke-width="2.5"/></g><g id="outplus"><rect x="282" y="51" width="48" height="56" rx="6" fill="#125d9c" stroke="#073d71" stroke-width="3"/><rect x="289" y="60" width="34" height="38" rx="4" fill="#d83535" stroke="#dce5e8" stroke-width="2"/><circle cx="306" cy="79" r="12" fill="url(#s)" stroke="#324859" stroke-width="3"/><path d="M299 75l14 8" stroke="#4b5961" stroke-width="2.5"/></g><g id="outminus"><rect x="282" y="114" width="48" height="56" rx="6" fill="#125d9c" stroke="#073d71" stroke-width="3"/><rect x="289" y="123" width="34" height="38" rx="4" fill="#20272e" stroke="#dce5e8" stroke-width="2"/><circle cx="306" cy="142" r="12" fill="url(#s)" stroke="#324859" stroke-width="3"/><path d="M299 138l14 8" stroke="#4b5961" stroke-width="2.5"/></g>
<!-- Labels near contacts, never over contacts -->
<g font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">
<text x="87" y="82">IN+</text><text x="87" y="147">IN−</text>
<text x="269" y="82" text-anchor="end">OUT+</text><text x="269" y="147" text-anchor="end">OUT−</text></g>
<!-- Potenciômetro de ajuste; circuitos sem marcações visuais excessivas -->
<rect x="145" y="19" width="82" height="43" rx="4" fill="#2286d4" stroke="#0b4f80" stroke-width="3"/>
<circle cx="186" cy="41" r="12" fill="#e5c883" stroke="#978452" stroke-width="3"/>
<path d="M178 42h16" stroke="#665947" stroke-width="3"/>
<!-- Trilha simples da placa, sem bobinas sobre os rótulos OUT -->
<path d="M114 176H243" stroke="#58b2e5" stroke-width="2" opacity=".43"/>
</svg>