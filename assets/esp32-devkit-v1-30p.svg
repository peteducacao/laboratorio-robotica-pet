<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 430" role="img" aria-labelledby="title desc">
<title id="title">ESP32 DevKit V1 de 30 pinos, vista superior, USB na esquerda</title>
<desc id="desc">Placa ESP32 WROOM 32 horizontal, com duas fileiras de 15 contatos rotulados em suas posições corretas; VIN e GND na fileira superior à esquerda, D27, D26, D32 acima, D18 abaixo, porta USB à esquerda.</desc>
