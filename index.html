<link rel="stylesheet" href="local-sync.css?v=1">

<link rel="icon" href="assets/logo-pet.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<body>
<main class="welcome" id="welcome" aria-label="Bem-vindo ao TinkerPET Studio">
 <!-- O cenário cobre a tela; a identidade original mantém proporção própria. -->
 <img id="welcomeArt" class="welcome-art" src="assets/welcome-clean-2026.svg" alt="Mascote TinkerPET, marca TinkerPET e botão Meus circuitos" decoding="async" fetchpriority="high">
 <span class="welcome-softlight" aria-hidden="true"></span>
 <span class="robot-blink" id="robotBlink" aria-hidden="true"></span>
 <span class="robot-eye-glint" id="robotGlint" aria-hidden="true"></span>
 <span class="robot-brow" id="robotBrow" aria-hidden="true"></span>
 <span class="robot-cheek left" id="robotCheekLeft" aria-hidden="true"></span>
 <span class="robot-cheek right" id="robotCheekRight" aria-hidden="true"></span>
 <span class="antenna-beacon" id="antennaGlow" aria-hidden="true"></span>
 <span class="robot-expression" id="robotExpression" aria-hidden="true"></span>
 <button class="robot-interaction" id="robotInteract" type="button"
    aria-label="Interagir com o mascote TinkerPET" title="Toque no robô para ver suas reações"></button>
 <span class="visually-hidden" id="robotFeedback" role="status" aria-live="polite"></span>
 <div class="ambient-particles" aria-hidden="true">
  <span class="light-dust gold"></span><span class="light-dust cyan"></span>
  <span class="light-dust cyan"></span><span class="light-dust gold"></span>
  <span class="light-dust gold"></span><span class="light-dust cyan"></span>
 </div>
 <a id="enterProjects" class="main-action" href="projects.html?release=20261031-gpio18-mobile-fix-v2" aria-label="Abrir Meus circuitos">
  <span class="cta-focus" aria-hidden="true"></span><span class="visually-hidden">Meus circuitos</span>
 </a>
 <footer class="site-credit-home">© 2026 TinkerPET Studio · Desenvolvido por Sérgio R. Santos </footer>
