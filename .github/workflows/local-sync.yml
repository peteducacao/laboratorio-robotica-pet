name: Verificar atualização local app e navegador
on:
  push:
    branches: [feature/same-device-local-refresh-and-icon-20261101]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check local-sync.js
          node --check pwa.js
          node --check tests/local-sync-browser.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar atualização local sem internet e segurança dos circuitos
        run: node tests/local-sync-browser.mjs
      - name: Regressão do PWA
        run: node tests/pwa-browser.mjs
