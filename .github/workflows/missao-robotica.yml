name: Missão Robótica 3D — testes reais
on:
  push:
    branches: [feature/missao-robotica-3d-20261104, feature/petgame-simplificacao-camera-20261104]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  jogo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do jogo
        run: |
          node --check missao-robotica.js
          node --check tests/missao-robotica-browser.mjs
      - name: Preparar navegador real
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar controles, reparos, perguntas e telas
        run: node tests/missao-robotica-browser.mjs
      - name: Guardar capturas de telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missao-robotica-3d-telas
          path: artifacts/*.png
          if-no-files-found: ignore
