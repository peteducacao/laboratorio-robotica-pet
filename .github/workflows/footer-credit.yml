name: Crédito de autoria TinkerPET — celular e computador
on:
  push:
    branches: [feature/footer-authorship-20261102]
  pull_request:
  workflow_dispatch:
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/footer-credit-browser.mjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir assinatura nas páginas inicial e Meus circuitos
        run: node tests/footer-credit-browser.mjs
