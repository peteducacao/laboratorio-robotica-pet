name: Verificações do laboratório

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Circuito e navegação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar dicas contextuais de montagem
        run: node tests/contextual-hints.cjs
      - name: Testar bancada e validações
        run: node tests/smoke.cjs
      - name: Conferir nova interface sem alterar o simulador
        run: |
          node --check studio-preview.js
          node tests/studio-preview.cjs

  preview-browser:
    name: Visual do Studio (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de teste
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir dicas em telas de celular e computador
        run: node tests/hints-browser.mjs
      - name: Conferir layout em telas de celular e computador
        run: node tests/preview-browser.mjs
      - name: Guardar capturas para revisão de design
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-preview-capturas
          path: test-results/*.png
          if-no-files-found: ignore
