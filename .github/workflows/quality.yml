name: Verificações do laboratório

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Circuito e navegação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar bancada e validações
        run: node tests/smoke.cjs
