name: Importar a arte aprovada do TinkerPET
on:
  push:
    paths:
      - '.github/workflows/import-hero-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar arte original em resolução de 1536x1024
        env:
          ART_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2Fbbc7ec21-549e-4356-95f1-d9d42bb978e7/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAJvHmTJ7cxl9oz2AfuivmgSRp7RuVdEdqOrsBdXb51bT&exp=1793413127&osig=AAAAAAAAAAAAAAAAAAAAAHhpI2k4aLQCCWeBujmyfDm-em6jvKuwJ1MO-kDhMAgn&signer=media-rpc&token=AAIAAU0AJGJiYzdlYzIxLTU0OWUtNDM1Ni05NWYxLWQ5ZDQyYmI5NzhlNwAAAAABoY_Am1h36woxPtM9w7mZeXQAUcM3QV-ruqxbOotjXVJsdIPTkA&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --max-time 90 "$ART_URL" --output assets/welcome-approved.png
          file assets/welcome-approved.png
          python3 - <<'PY'
          import struct
          p=open('assets/welcome-approved.png','rb').read()
          assert p[:8]==b'\x89PNG\r\n\x1a\n', 'Formato não é PNG'
          w,h=struct.unpack('>II',p[16:24])
          print('Imagem:',w,h,'bytes:',len(p))
          assert w>=1000 and h>=600, 'Arquivo de baixa resolução: não publicar'
          PY
      - name: Publicar somente a imagem
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/welcome-approved.png
          git diff --cached --quiet || (git commit -m "Adicionar arte de abertura aprovada do TinkerPET" && git push)
