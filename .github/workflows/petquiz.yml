name: PETQuiz · navegador e eventos surpresa
on:
  push:
    branches: [main]
    paths:
      - 'petquiz.html'
      - 'petquiz.css'
      - 'petquiz.js'
      - 'app.js'
      - 'app-mobile.js'
      - 'mobile-editor.css'
      - 'editor.html'
      - 'projects.html'
      - 'projects.css'
      - 'tests/petquiz-browser.mjs'
      - 'tests/mobile-loose-end-browser.mjs'
      - '.github/workflows/petquiz.yml'
  workflow_dispatch:
jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check petquiz.js
          node --check app.js
          node --check app-mobile.js
          node --check tests/petquiz-browser.mjs
          node --check tests/mobile-loose-end-browser.mjs
      - name: Instalar navegador
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reproduzir no Android fio solto e várias curvas após retomada
        run: node tests/mobile-loose-end-browser.mjs
      - name: Jogar PETQuiz em quatro telas
        run: node tests/petquiz-browser.mjs
      - name: Capturas de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petquiz-capturas
          path: test-results/petquiz-*.png
          if-no-files-found: ignore
