<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffcfa">
<meta name="description" content="Meus circuitos do TinkerPET. Organize, edite, duplique, importe e baixe projetos salvos neste navegador.">
<title>Meus circuitos • TinkerPET Studio</title>
<link rel="icon" href="assets/logo-pet.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="projects.css?v=9">
<script defer src="projects.js?v=9"></script>
</head>
<body>
<header class="top">
 <a class="brand" href="./" aria-label="Ir para o início do TinkerPET"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3m8-3v3M5 8H3m18 0h-2M8 17v4m8-4v4M6 7h12v10H6zM9 11l2 2 4-4"/></svg></span><span>TinkerPET <span>Studio</span></span></a>
 <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="searchCircuits" type="search" placeholder="Buscar circuito..." aria-label="Buscar circuito"></label>
 <select id="sortCircuits" class="filter" aria-label="Ordenar circuitos"><option value="recent">Mais recentes</option><option value="name">Nome A–Z</option><option value="components">Mais peças</option></select>
 <button id="nickButton" type="button" class="nick" title="Editar meu Nick" aria-label="Editar meu Nick"><span class="nick-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-8 16-8 16 0"/></svg></span><span id="nickText" class="nick-name">Seu Nick</span> ✎</button>
</header>
<div class="shell">
 <aside class="sidebar">
  <nav class="nav" aria-label="Menu principal">
   <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m3 11 9-8 9 8v10h-6v-7H9v7H3z"/></svg>Início</a>
   <a class="active" href="projects.html?release=20261030wirepark1" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v11h7v-7h5V7"/></svg>Meus circuitos</a>
   <button type="button" id="openGate"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>Gabarito 🔒</button>
  </nav>
  <div class="stats">
   <div class="stat"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/></svg><div><span>Total de circuitos</span><strong id="projectCount">0</strong></div></div>
   <div class="stat"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg><div><span>Último editado</span><strong id="lastCircuit">—</strong></div></div>
   <div class="stat"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 13h18"/></svg><div style="flex:1"><span>Armazenamento local</span><div class="usage"><i id="storageBar"></i></div><span id="storageUsed">0 KB usados</span></div></div>
  </div>
 </aside>
 <main class="main">
  <div class="intro"><h1>Meus circuitos</h1><div class="actions">
   <button class="btn primary" id="newCircuit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 4v16M4 12h16"/></svg>Novo circuito</button>
   <button class="btn" id="importCircuit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>Importar circuito</button>
   <input type="file" id="importFile" accept=".json,.tinkerpet,application/json" hidden>
  </div></div>
  <div class="board" id="projectsGrid" aria-live="polite"></div>
 </main>
</div>
<dialog id="editDialog" class="modal"><form class="modal-body" id="editForm"><h2 id="editTitle">Editar</h2><label for="editInput">Nome</label><input id="editInput" type="text" maxlength="80" required><p class="error" id="editError"></p><div class="modal-actions"><button type="button" id="cancelEdit">Cancelar</button><button type="submit" class="ok" id="editSave">Salvar</button></div></form></dialog>
<dialog id="confirmDialog" class="modal"><div class="modal-body"><h2 id="confirmTitle">Excluir?</h2><p id="confirmBody"></p><div class="modal-actions"><button type="button" id="confirmNo">Cancelar</button><button class="ok" type="button" id="confirmYes">Confirmar</button></div></div></dialog>
<dialog id="gateDialog" class="modal" aria-label="Senha do Gabarito"><form class="modal-body gate-card" id="gateForm"><div class="gate-mark"><img src="assets/logo-pet.svg" alt="PET Educação"></div><h2>TinkerPET</h2><label for="gatePassword" style="text-align:left">Senha</label><input id="gatePassword" type="password" autocomplete="off" required placeholder="••••••••"><p class="error" id="gateError" aria-live="polite"></p><div class="modal-actions"><button type="button" id="gateClose">Cancelar</button><button class="ok" type="submit">Entrar</button></div></form></dialog>
<div class="message" id="notice" role="status" hidden></div>
</body></html>
